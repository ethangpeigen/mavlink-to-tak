# Copy this file to config.ini and edit it. Passwords are NOT stored here: the bridge asks for the certificate
# password when it starts (or reads the environment variable TAK_CERT_PASSWORD).
[mavlink_to_tak]

# --- the telemetry radio (RFD900 / SiK) -------------------------------------------------------------------------
# Find the port in Device Manager under "Ports (COM & LPT)", e.g. "USB Serial Port (COM7)" -> COM7.
MAVLINK_PORT = COM7
MAVLINK_BAUD = 57600
# Leave empty to use the first vehicle heard. Set a number (the vehicle's SYSID_THISMAV) if several vehicles share the link.
MAV_SYSID =
# 0 = listen only (recommended). 1 = also send a GCS heartbeat and request position data at 2 Hz (transmits to the vehicle).
MAV_REQUEST_STREAMS = 0

# --- how the vehicle appears in TAK ------------------------------------------------------------------------------
CALLSIGN = Mayman
# Unique ID of the track. Empty = same as the callsign.
UID =
# a-f-A-M-H-Q = friendly, air, military, rotary-wing UAV. Fixed-wing UAV: a-f-A-M-F-Q. Unknown affiliation: a-u-A-M-H-Q.
COT_TYPE = a-f-A-M-H-Q
TEAM = Cyan
ROLE = Team Member
UPDATE_SECONDS = 1.0
STALE_SECONDS = 30
MAX_TELEMETRY_AGE = 5
REMARKS_MGRS_DIGITS = 5

# --- the TAK Server ----------------------------------------------------------------------------------------------
# Secure streaming port is usually 8089: tls://your-server:8089
# Plain TCP (no certificate) is tcp://host:8087. Multicast SA for WinTAK on the same network: udp+wo://239.2.3.1:6969
COT_URL = tls://your-tak-server.example:8089
# Your client certificate (.p12) from the TAK data package.
TLS_CLIENT_CERT = certs\client.p12
# The server's CA as PEM. Make it from the truststore .p12 with:  python convert_truststore.py certs\truststore-root.p12 certs\ca.pem
TLS_CLIENT_CAFILE = certs\ca.pem
# Set to 1 if you connect by IP address, or the server certificate's name differs from the address.
TLS_DONT_CHECK_HOSTNAME = 0
# 1 turns server verification off entirely. Only for a quick test; leave at 0.
TLS_DONT_VERIFY = 0
